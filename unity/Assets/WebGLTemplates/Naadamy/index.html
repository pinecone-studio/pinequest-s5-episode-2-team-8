<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#76b947">
  <link rel="icon" href="data:,">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #182441; overscroll-behavior: none; }
    /* the game fills the window; it is drawn for landscape, like the phone app */
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #182441; touch-action: none; outline: none; }
    .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px;
      box-sizing: border-box; text-align: center; font: 700 18px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; color: #fff; }
    #loading { z-index: 3; overflow: hidden; isolation: isolate; gap: 0; padding: 24px;
      background: #718dbb; image-rendering: pixelated; }
    .landscape { position: absolute; z-index: -1; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
    .load-card { width: min(430px, 100%); box-sizing: border-box; padding: clamp(24px, 5vw, 38px); display: flex; flex-direction: column; align-items: center; gap: 14px;
      border: 4px solid #211b2d; outline: 3px solid #f4cd76; background: #29233b;
      box-shadow: 8px 8px 0 #211b2d, 0 14px 36px rgba(20, 25, 39, .3); }
    .brand-mark { width: 44px; height: 44px; display: grid; place-items: center; color: #44331e; font-size: 25px;
      background: #f4cf78; border: 3px solid #211b2d; box-shadow: 3px 3px 0 #211b2d; }
    .load-title { margin: 0; color: #ffe29a; font-size: clamp(28px, 5vw, 38px); line-height: 1.1; letter-spacing: .04em;
      text-shadow: 3px 3px 0 #211b2d; }
    .load-subtitle { margin: 0; color: #fff7df; font-size: 16px; text-shadow: 2px 2px 0 #211b2d; }
    .load-note { margin: 0; color: #c9d9c2; font-size: 12px; font-weight: 500; }
    #bar { width: min(320px, 70vw); height: 14px; border: 3px solid #171725; background: #111a2c; overflow: hidden; image-rendering: pixelated; }
    #fill { width: 0; height: 100%; background: repeating-linear-gradient(90deg, #f4c466 0 12px, #ffe6a0 12px 16px); transition: width .2s; }
    #turn { display: none; z-index: 4; background: linear-gradient(180deg, #718ab1, #d8ab72 68%, #526b4a); }
    #turn b { font-size: 48px; }
    @media (orientation: portrait) and (pointer: coarse) { #turn { display: flex; } }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading" class="screen">
    <svg class="landscape" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges" aria-hidden="true">
      <rect width="320" height="180" fill="#718dbb" />
      <rect y="80" width="320" height="18" fill="#f2b978" />
      <rect y="98" width="320" height="12" fill="#e5a96e" />
      <rect x="224" y="24" width="32" height="8" fill="#ffe6a0" /><rect x="216" y="32" width="48" height="8" fill="#ffe6a0" />
      <rect x="224" y="40" width="32" height="8" fill="#ffe6a0" />
      <path d="M0 111h36V95h20V83h16V71h16V83h16v16h24V83h16V67h16V55h16V67h16v16h20v16h24v12h28v38H0z" fill="#8d8d72" />
      <path d="M0 124h24v-9h24v-8h24v8h24v9h32v-10h24v-9h24v9h24v10h24v-8h24v8h48v34H0z" fill="#77845b" />
      <path d="M0 139h40v-8h24v8h32v10h24v-8h32v8h24v-10h24v10h32v-8h24v8h40v31H0z" fill="#526a49" />
      <path d="M0 162h48v-7h24v7h40v8h32v-8h24v8h40v-8h32v8h24v-8h56v18H0z" fill="#344b40" />
      <rect x="42" y="119" width="34" height="18" fill="#332b37" /><path d="M38 120l21-17 22 17z" fill="#8b463c" />
      <rect x="47" y="123" width="24" height="14" fill="#e0ad71" /><rect x="55" y="128" width="8" height="9" fill="#30283a" />
      <rect x="44" y="117" width="30" height="3" fill="#eacb87" />
      <rect x="130" y="116" width="3" height="3" fill="#f4d28d" /><rect x="201" y="126" width="3" height="3" fill="#f4d28d" />
      <rect x="282" y="114" width="3" height="3" fill="#f4d28d" /><rect x="104" y="143" width="4" height="4" fill="#91a66a" />
      <rect x="248" y="151" width="4" height="4" fill="#91a66a" />
    </svg>
    <div class="load-card">
      <div class="brand-mark" aria-hidden="true">✦</div>
      <h1 class="load-title">Naadamy</h1>
      <p class="load-subtitle">Naadamy is loading…</p>
      <div id="bar" role="progressbar" aria-label="Loading"><div id="fill"></div></div>
      <p class="load-note">A little village is waking up</p>
    </div>
  </div>
  <div id="turn" class="screen"><b>🔄</b><div>Утсаа хэвтээ эргүүлээрэй<br><small>Turn your phone sideways</small></div></div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    createUnityInstance(document.querySelector('#unity-canvas'), {
      dataUrl: 'Build/{{{ DATA_FILENAME }}}',
      frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: 'Build/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2), // sharp, without making phones draw 3x the pixels
    }, (p) => { document.querySelector('#fill').style.width = Math.round(p * 100) + '%'; })
      .then(() => { document.querySelector('#loading').remove(); document.querySelector('#unity-canvas').focus(); })
      .catch((e) => { document.querySelector('#loading').innerHTML = '<div>Тоглоом ачаалж чадсангүй.<br><small>The game could not load: ' + String(e).replace(/</g, '&lt;') + '</small></div>'; });
  </script>
</body>
</html>
