<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#76b947">
  <link rel="icon" href="data:,">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #76b947; overscroll-behavior: none; }
    /* the game fills the window; it is drawn for landscape, like the phone app */
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #76b947; touch-action: none; outline: none; }
    .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px;
      box-sizing: border-box; text-align: center; font: 700 18px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; color: #fff; background: #76b947; }
    #bar { width: min(320px, 70vw); height: 14px; border-radius: 7px; background: rgba(43, 30, 46, .3); overflow: hidden; }
    #fill { width: 0; height: 100%; background: #f7c646; transition: width .2s; }
    #turn { display: none; z-index: 2; }
    #turn b { font-size: 48px; }
    @media (orientation: portrait) and (pointer: coarse) { #turn { display: flex; } }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading" class="screen"><div>Naadamy ачаалж байна…<br><small>Naadamy is loading…</small></div><div id="bar"><div id="fill"></div></div></div>
  <div id="turn" class="screen"><b>🔄</b><div>Утсаа хэвтээ эргүүлээрэй<br><small>Turn your phone sideways</small></div></div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    createUnityInstance(document.querySelector('#unity-canvas'), {
      dataUrl: 'Build/{{{ DATA_FILENAME }}}',
      frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: 'Build/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2), // sharp, without making phones draw 3x the pixels
    }, (p) => { document.querySelector('#fill').style.width = Math.round(p * 100) + '%'; })
      .then(() => { document.querySelector('#loading').remove(); document.querySelector('#unity-canvas').focus(); })
      .catch((e) => { document.querySelector('#loading').innerHTML = '<div>Тоглоом ачаалж чадсангүй.<br><small>The game could not load: ' + String(e).replace(/</g, '&lt;') + '</small></div>'; });
  </script>
</body>
</html>
